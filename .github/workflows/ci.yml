name: CI

# Runs the full pytest suite against every reasoning engine the app supports
# (see app/core/llm.py): Groq (cloud, needs a GROQ_API_KEY secret), Gemini
# (cloud, needs a GEMINI_API_KEY secret), and Ollama (fully local, no secret
# needed - the runner installs Ollama itself and pulls the same model used
# for local dev). Every LLM-calling test skips itself gracefully when none
# of these are configured (see tests/conftest.py::requires_llm_configured),
# so this workflow never fails just because a secret is missing - it just
# skips fewer/more tests.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  test-groq:
    name: Tests (Groq)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest -v

  test-gemini:
    name: Tests (Gemini)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest -v

  test-ollama:
    name: Tests (Ollama, local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && exit 0
            sleep 2
          done
          echo "Ollama server did not become ready in time"; cat /tmp/ollama.log; exit 1

      - name: Pull model
        run: ollama pull mistral

      - name: Run tests
        env:
          LLM_PROVIDER: ollama
          OLLAMA_MODEL: mistral
          OLLAMA_BASE_URL: http://localhost:11434
        run: pytest -v
