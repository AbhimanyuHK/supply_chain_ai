[project]
name = "supply-chain-planning-platform"
version = "0.1.0"
description = "AI-powered Supply Chain Planning Platform (Agentic AI, LangGraph, Groq)."
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires Postgres to be running (see docker-compose.yml)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
