[project]
name = "supply-chain-planning-platform"
version = "1.2.0"
description = "AI-powered Supply Chain Planning Platform (Agentic AI, LangGraph, Groq)."
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires Postgres to be running (see docker-compose.yml)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# planning_date/date.today() test fixtures and CLI defaults are calendar days, not
# instants - no timezone semantics apply, so DTZ011 is a false positive here.
"tests/*" = ["DTZ011"]
"scripts/*" = ["DTZ011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Path() in argument defaults is the required, documented
# pattern (see fastapi.tiangolo.com) - not the mutable-default-argument bug B008 flags.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
